services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: duk
      POSTGRES_PASSWORD: dukpassword
      POSTGRES_DB: duk_bus
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./duk_micro/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - bus-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - bus-net

  osrm-backend:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/trivandrum_patched.osrm"]
    volumes:
      - ./duk_micro/osrm-data:/data
    networks:
      - bus-net

  # ==========================================
  # Application Services (Combined)
  # ==========================================
  core-api:
    image: duk_micro_unified:latest
    build:
      context: ./duk_micro
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./duk_micro/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OSRM_URL=http://osrm-backend:5000
    depends_on:
      - postgres
      - redis
      - osrm-backend
    volumes:
      - ./duk_micro/models:/app/models
      - audit_logs:/app/logs
    networks:
      - bus-net
    labels:
      - "traefik.enable=true"
      # Route traffic matching /api, /ws, /docs to this container (works with any IP or domain)
      - "traefik.http.routers.core-api.rule=PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`)"
      - "traefik.http.routers.core-api.entrypoints=web"
      # Optional Let's Encrypt (requires uncommenting cert resolver in traefik args)
      # - "traefik.http.routers.core-api-secure.rule=(Host(`duk.ac.in`) || Host(`localhost`)) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))"
      # - "traefik.http.routers.core-api-secure.entrypoints=websecure"
      # - "traefik.http.routers.core-api-secure.tls.certresolver=myresolver"

  background-workers:
    image: duk_micro_unified:latest
    build:
      context: ./duk_micro
      dockerfile: Dockerfile
    command: ["/bin/bash", "/app/start_workers.sh"]
    restart: unless-stopped
    env_file:
      - ./duk_micro/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./duk_micro/models:/app/models
    networks:
      - bus-net

  # ==========================================
  # Reverse Proxy
  # ==========================================
  gateway:
    image: traefik:latest
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # To enable Let's Encrypt SSL, uncomment the lines below and add your email
      # - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      # - "--certificatesresolvers.myresolver.acme.email=admin@duk.ac.in"
      # - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_API_VERSION=1.41
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
    networks:
      - bus-net

networks:
  bus-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  letsencrypt_data:
  audit_logs:
