<html lang="en" class="theme-liquid-glass">
  <head>
    <meta charset="UTF-8" />


    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque status bar (matches the white header). black-translucent used to
         paint a grey haze over the header near the notch — "default" is crisp. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DUK Bus" />

    <title>DUK Bus Tracker</title>
    <meta
      name="description"
      content="Real-time bus tracking for Digital University Kerala students."
    />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

    <!-- Google Identity Services (GSI) for Google OAuth Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Critical splash styling so the loading screen is visible before JS/CSS loads -->
    <style>
      html,
      body,
      #root {
        height: 100dvh;
        margin: 0;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #f4f5f7;
        background-image: url("/bus/splash_screen.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .splash-content {
        position: absolute;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        text-align: center;
        color: #333333;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .splash-loader {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: #10a8ff;
        border-right-color: #4fb893;
        animation: splash-spin 1s linear infinite;
        margin: 0 auto 12px;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .splash-text {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
    </style>
