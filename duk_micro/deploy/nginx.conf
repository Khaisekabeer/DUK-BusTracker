# /etc/nginx/sites-available/duk-bus
#
# DUK Bus Tracker — Nginx reverse proxy configuration
#
# This file configures Nginx to:
#   1. Serve the React PWA (static files) at the root URL
#   2. Proxy /api/* requests to the Python backend (port 8000)
#   3. Handle WebSocket connections for real-time GPS updates
#   4. Redirect HTTP to HTTPS
#
# TO ACTIVATE:
#   1. Replace YOUR_DOMAIN_HERE with your actual domain
#   2. Run: certbot --nginx -d your-domain.com
#   3. Certbot will add SSL config automatically
#   4. Reload: systemctl reload nginx

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    # Let certbot verify domain ownership via this path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;

    # SSL certificates (managed by certbot — do not edit manually)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

    # Modern SSL settings (TLS 1.2+ only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    # Makes JS/CSS files smaller in transit (PWA assets load faster)
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # ── PWA static files ──────────────────────────────────────────────────────
    # Serve the built React app from /var/www/duk-pwa
    root /var/www/duk-pwa;
    index index.html;

    # React Router — serve index.html for all non-file URLs so the browser
    # can handle routing (e.g., /route-view, /map don't 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache PWA assets aggressively (they have hashed filenames, safe to cache forever)
    location ~* \.(js|css|png|jpg|svg|woff|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    # Forward all /api/* requests to the Python backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Pass the real client IP to the backend for rate limiting
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    # WebSockets need special handling: upgrade the HTTP connection
    # and keep it open for up to 24 hours (for live GPS streaming)
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required headers to upgrade HTTP to WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Keep the connection alive for the duration of the bus trip
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── GPS device WebSocket ──────────────────────────────────────────────────
    # The hardware bus device connects here to stream GPS data
    location /ws/device {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }
}
