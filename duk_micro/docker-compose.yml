version: '3.8'

services:
  gateway:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8000"
    ports:
      - "8000:8000"
      - "8080:8080" # Traefik dashboard
    volumes:
      - ./gateway:/etc/traefik
    networks:
      - bus-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - bus-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: duk
      POSTGRES_PASSWORD: dukpassword
      POSTGRES_DB: duk_bus
    ports:
      - "5432:5432"
    networks:
      - bus-net
    volumes:
      - pgdata:/var/lib/postgresql/data

  osrm-backend:
    image: osrm/osrm-backend
    command: "osrm-routed --algorithm mld /data/kerala-latest.osrm"
    volumes:
      - ./osrm-data:/data
    networks:
      - bus-net

  gps-ingestion:
    build: 
      context: .
      dockerfile: services/gps-ingestion/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
      - GPS_API_KEY=local-dev-key
      - OSRM_URL=http://osrm-backend:5000
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  realtime-gateway:
    build:
      context: .
      dockerfile: services/realtime-gateway/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - bus-net
    depends_on:
      - redis

  trip-lifecycle:
    build:
      context: .
      dockerfile: services/trip-lifecycle/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
      - OSRM_URL=http://osrm-backend:5000
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
      - JWT_SECRET=dev-secret-key
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  tracking-service:
    build:
      context: .
      dockerfile: services/tracking-service/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
      - OSRM_URL=http://osrm-backend:5000
      - ETA_ML_URL=http://eta-ml-service:8000
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
      - ADMIN_TOKEN=secret-admin-token
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  notification-api:
    build:
      context: .
      dockerfile: services/notification-api/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://duk:dukpassword@postgres/duk_bus
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  notification-consumer:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    command: ["python", "event_consumer.py"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  notification-scheduler:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    command: ["python", "scheduled_dispatcher.py"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

  eta-ml-service:
    build:
      context: .
      dockerfile: services/eta-ml-service/Dockerfile
    environment:
      - OSRM_URL=http://osrm-backend:5000
    volumes:
      - model-data:/app/models
    networks:
      - bus-net

  ml-training-job:
    build:
      context: .
      dockerfile: services/ml-training-job/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://duk:dukpassword@postgres/duk_bus
      - REDIS_URL=redis://redis:6379/0
      - ETA_ML_URL=http://eta-ml-service:8000
      - MODEL_PATH=/data/models/eta_model.pkl
    volumes:
      - model-data:/data/models
    networks:
      - bus-net
    depends_on:
      - redis
      - postgres

networks:
  bus-net:
    driver: bridge

volumes:
  pgdata:
  model-data:
