apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: bus-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      containers:
      - name: notification-api
        image: duk-bus/notification-api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: bus-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: notification-api
  namespace: bus-system
spec:
  selector:
    app: notification-api
  ports:
  - port: 80
    targetPort: 8000
