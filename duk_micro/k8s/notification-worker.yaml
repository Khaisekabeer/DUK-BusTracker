apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: bus-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
      - name: notification-worker
        image: duk-bus/notification-service:latest
        command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info"]
        envFrom:
        - secretRef:
            name: bus-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-consumer
  namespace: bus-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-consumer
  template:
    metadata:
      labels:
        app: notification-consumer
    spec:
      containers:
      - name: notification-consumer
        image: duk-bus/notification-service:latest
        command: ["python", "event_consumer.py"]
        envFrom:
        - secretRef:
            name: bus-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-scheduler
  namespace: bus-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-scheduler
  template:
    metadata:
      labels:
        app: notification-scheduler
    spec:
      containers:
      - name: notification-scheduler
        image: duk-bus/notification-service:latest
        command: ["python", "scheduled_dispatcher.py"]
        envFrom:
        - secretRef:
            name: bus-secrets
