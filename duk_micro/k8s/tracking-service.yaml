apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: bus-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
    spec:
      containers:
      - name: tracking-service
        image: duk-bus/tracking-service:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: bus-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: bus-system
spec:
  selector:
    app: tracking-service
  ports:
  - port: 80
    targetPort: 8000
