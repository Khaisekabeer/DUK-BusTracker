apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: bus-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
      - name: admin-service
        image: duk-bus/admin-service:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: bus-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: bus-system
spec:
  selector:
    app: admin-service
  ports:
  - port: 80
    targetPort: 8000
